server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [cid=%X{correlationId:-}] %logger{36} - %msg%n"

spring:
  application:
    name: social-posts-api
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  cache:
    type: jcache
    jcache:
      config: classpath:ehcache.xml

app:
  cors:
    allowed-origin: ${FRONTEND_ORIGIN}
  jwt:
    secret-base64: ${JWT_SECRET_BASE64}
    access-token-minutes: ${ACCESS_TOKEN_MINUTES:15}
    refresh-token-days: ${REFRESH_TOKEN_DAYS:30}
  encryption:
    key-base64: ${AES_ENCRYPTION_KEY_BASE64}
  cookie:
    secure: ${COOKIE_SECURE:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
